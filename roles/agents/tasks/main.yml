- name: Load vault secrets
  ansible.builtin.include_vars:
    file: "{{ dotfiles_home }}/vault/secrets.yml"

- name: Install Claude Code CLI
  homebrew_cask:
    name: claude-code

- name: Install codex via devbox global
  command: devbox global add codex@latest
  register: codex_install
  changed_when: "'already' not in codex_install.stderr"

- name: Check if Claude config exists
  stat: path="{{ claude_config_dir }}"
  register: claude_config_stat

- name: Back up Claude config
  command: "mv {{ claude_config_dir }} {{ claude_config_dir }}_old"
  args:
    creates: "{{ claude_config_dir }}_old"
  when: claude_config_stat.stat.exists

- name: Symlink Claude config
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/claude"
    dest: "{{ claude_config_dir }}"
    state: link
    force: yes

- name: Symlink shared skills for Claude
  file:
    src: "{{ shared_skills_dir }}"
    dest: "{{ claude_config_dir }}/skills"
    state: link
    force: yes

- name: Check if Codex config exists
  stat: path="{{ codex_config_dir }}"
  register: codex_config_stat

- name: Back up Codex config
  command: "mv {{ codex_config_dir }} {{ codex_config_dir }}_old"
  args:
    creates: "{{ codex_config_dir }}_old"
  when: codex_config_stat.stat.exists

- name: Symlink Codex config
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/codex"
    dest: "{{ codex_config_dir }}"
    state: link
    force: yes

- name: Create shared agent skills parent directory
  file:
    path: "{{ agents_skills_dir | dirname }}"
    state: directory

- name: Symlink shared skills for Codex
  file:
    src: "{{ shared_skills_dir }}"
    dest: "{{ agents_skills_dir }}"
    state: link
    force: yes

- name: Tap anomalyco/tap for opencode
  homebrew_tap:
    name: anomalyco/tap
    state: present

- name: Trust opencode tap
  command: brew trust --tap anomalyco/tap
  changed_when: false

- name: Install opencode
  homebrew:
    name: anomalyco/tap/opencode
    state: present

- name: Create opencode config dir
  file:
    path: "{{ opencode_config_dir }}"
    state: directory

- name: Symlink opencode tui config
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/tui.json"
    dest: "{{ opencode_config_dir }}/tui.json"
    state: link
    force: yes

- name: Symlink opencode themes
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/themes"
    dest: "{{ opencode_config_dir }}/themes"
    state: link
    force: yes

- name: Symlink opencode config
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/opencode.json"
    dest: "{{ opencode_config_dir }}/opencode.json"
    state: link
    force: yes

- name: Symlink opencode agents
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/agent"
    dest: "{{ opencode_config_dir }}/agent"
    state: link
    force: yes

- name: Symlink opencode commands
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/command"
    dest: "{{ opencode_config_dir }}/command"
    state: link
    force: yes

- name: Symlink opencode plugins
  file:
    src: "{{ dotfiles_home }}/roles/agents/files/opencode/plugin"
    dest: "{{ opencode_config_dir }}/plugin"
    state: link
    force: yes

- name: Symlink shared skills for opencode
  file:
    src: "{{ shared_skills_dir }}"
    dest: "{{ opencode_config_dir }}/skills"
    state: link
    force: yes

- name: Record role in lockfile
  command: "{{ playbook_dir }}/bin/lock-role {{ ansible_role_name }}"
  changed_when: false
